name: Go migration check
on:
  push:
    branches:
      - go-full-migration
  workflow_dispatch:

concurrency:
  group: cfnb-go-full-migration-check
  cancel-in-progress: false

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check shell script syntax
        run: bash -n setup.sh && bash -n run.sh
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'setup.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'run.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Format Go source
        run: gofmt -w *.go
      - name: Test compile
        run: go test ./...
      - name: Build executable
        run: go build -o cfnb .
